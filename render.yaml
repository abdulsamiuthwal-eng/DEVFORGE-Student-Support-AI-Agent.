services:
  - type: web
    name: devforge-student-support-agent
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMAAPIKEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
